openapi: 3.1.0
info:
  title: RouteWise API
  description: |
    REST API of RouteWise: it calculates what a car trip across Europe costs (fuel, road charges, lodging)
    and keeps the history of the user's calculations.

    **Base path** `/api/v1` (the version is part of the path). **Format** JSON, UTF-8.

    **Authentication.** Register or sign in, then send `Authorization: Bearer <access_token>`.
    Access tokens live 15 minutes; renew them with the single-use refresh token. Reference data
    (`/countries`, `/fuel-prices`, ...) is public.

    **Numbers.** Money, prices and distances are decimal numbers serialised as JSON **strings**
    (`"50.46"`) so that no precision is lost. Amounts are in euro. Timestamps are ISO 8601 with offset.

    **Errors.** Every error has the same shape:
    `{"error": {"code", "message", "details", "request_id"}}`. The `request_id` is also returned in the
    `X-Request-ID` header; send your own `X-Request-ID` to trace a call end to end.

    Guides: Getting Started, integration tutorial, authentication, errors and architecture are in the
    repository folder `docs/api/`.
  contact:
    name: RouteWise (EHU diploma project)
    url: https://github.com/ShadAre05/RouteWise
  license:
    name: See the repository
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Local Docker Compose stack
paths:
  /health:
    get:
      tags:
      - service
      summary: 'Liveness: the process is running'
      description: Answers 200 while the process runs. Use it for container liveness probes; it does not touch the
        database.
      operationId: health
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health
              examples:
                default:
                  summary: Process is alive
                  value:
                    status: ok
  /health/ready:
    get:
      tags:
      - service
      summary: 'Readiness: the database answers'
      description: Answers 200 when the database accepts a query, otherwise 500. Use it for readiness probes.
      operationId: ready
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Ready
              examples:
                default:
                  summary: Database answers
                  value:
                    status: ready
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Create an account
      description: |
        Creates an account and signs the user in. The password is hashed inside PostgreSQL (bcrypt); it is never
        stored or logged.

        Returns an access token (15 minutes) and a single-use refresh token. Errors: 409 when the e-mail is
        taken, 422 when a field is invalid.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                summary: New account
                value:
                  email: driver@example.com
                  password: correct-horse-battery
                  privacy_accepted: true
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  summary: Account created
                  value: &id001
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOi...
                    refresh_token: 5ceIFcTIm95XFCvLwSZy4tZPOONIK4T3f7nYpJD9OxVp3VxwBd662d1j4zchTofv
                    token_type: bearer
                    expires_in: 900
        '409':
          description: Conflict with existing data (for example the e-mail is already registered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  summary: E-mail already registered
                  value:
                    error:
                      code: conflict
                      message: this e-mail is already registered
                      details: null
                      request_id: fb956027107b4a219803813b9a854540
        '422':
          description: Invalid input (`details` lists the fields) or no route between the points
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  summary: Several invalid fields
                  value:
                    error:
                      code: validation_failed
                      message: request validation failed
                      details:
                      - field: email
                        message: 'value is not a valid email address: An email address must have an @-sign.'
                      - field: password
                        message: String should have at least 8 characters
                      - field: privacy_accepted
                        message: Input should be True
                      request_id: fb956027107b4a219803813b9a854540
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in
      description: |
        Checks the e-mail and password and returns a token pair.

        After 5 failed attempts the account is locked for 10 minutes; the answer is then the same 401 as for a
        wrong password, so an attacker learns nothing.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                summary: Sign in
                value:
                  email: driver@example.com
                  password: correct-horse-battery
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  summary: Signed in
                  value: *id001
        '401':
          description: Missing, malformed or expired access token, or wrong login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  summary: Wrong e-mail or password (also while the account is locked)
                  value:
                    error:
                      code: unauthorized
                      message: invalid e-mail or password
                      details: null
                      request_id: fb956027107b4a219803813b9a854540
        '422':
          description: Invalid input (`details` lists the fields) or no route between the points
          content:
            application/json:
              schema: *id002
              example:
                error:
                  code: validation_failed
                  message: request validation failed
                  details: null
                  request_id: fb956027107b4a219803813b9a854540
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Exchange a refresh token
      description: |
        Exchanges a refresh token for a new token pair. Every refresh token works **once** (rotation): the old
        one is revoked, so a stolen and already used token is useless.
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              default:
                summary: Renew the tokens
                value: &id003
                  refresh_token: 5ceIFcTIm95XFCvLwSZy4tZPOONIK4T3f7nYpJD9OxVp3VxwBd662d1j4zchTofv
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  summary: New token pair; the old refresh token is dead
                  value: *id001
        '401':
          description: Missing, malformed or expired access token, or wrong login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  summary: Unknown, used or expired refresh token
                  value:
                    error:
                      code: unauthorized
                      message: invalid or expired refresh token
                      details: null
                      request_id: fb956027107b4a219803813b9a854540
        '422':
          description: Invalid input (`details` lists the fields) or no route between the points
          content:
            application/json:
              schema: *id002
              example:
                error:
                  code: validation_failed
                  message: request validation failed
                  details: null
                  request_id: fb956027107b4a219803813b9a854540
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Revoke a refresh token
      description: |
        Revokes a refresh token. Always answers 204, also for an unknown or already revoked token, so the call
        is safe to repeat.
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              default:
                summary: Revoke a refresh token
                value: *id003
        required: true
      responses:
        '204':
          description: Success, no content
        '422':
          description: Invalid input (`details` lists the fields) or no route between the points
          content:
            application/json:
              schema: *id002
              example:
                error:
                  code: validation_failed
                  message: request validation failed
                  details: null
                  request_id: fb956027107b4a219803813b9a854540
  /api/v1/auth/change-password:
    post:
      tags:
      - auth
      summary: Change the password (US-19)
      description: Changes the password of the signed-in user and revokes all refresh tokens. Requires the old password.
      operationId: change_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              default:
                summary: Change the password
                value:
                  old_password: correct-horse-battery
                  new_password: even-better-passphrase
        required: true
      responses:
        '204':
          description: Success, no content
        '401':
          description: Missing, malformed or expired access token, or wrong login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrong_old:
                  summary: The old password is wrong
                  value:
                    error:
                      code: unauthorized
                      message: the current password is wrong
                      details: null
                      request_id: fb956027107b4a219803813b9a854540
                missing: &id004
                  summary: No Authorization header
                  value:
                    error:
                      code: unauthorized
                      message: missing bearer token
                      details: null
                      request_id: fb956027107b4a219803813b9a854540
                expired: &id005
                  summary: 'Expired or malformed token: refresh it, then sign in again'
                  value:
                    error:
                      code: unauthorized
                      message: invalid or expired token
                      details: null
                      request_id: fb956027107b4a219803813b9a854540
        '422':
          description: Invalid input (`details` lists the fields) or no route between the points
          content:
            application/json:
              schema: *id002
              examples:
                default:
                  summary: New password too short
                  value:
                    error:
                      code: validation_failed
                      message: request validation failed
                      details:
                      - field: new_password
                        message: String should have at least 8 characters
                      request_id: fb956027107b4a219803813b9a854540
      security:
      - HTTPBearer: []
  /api/v1/users/me:
    delete:
      tags:
      - auth
      summary: Delete the account and all its data (US-20)
      description: Permanently deletes the account with its vehicles, trips and tokens (US-20). Cannot be undone.
      operationId: delete_account
      responses:
        '204':
          description: Success, no content
        '401':
          description: Missing, malformed or expired access token, or wrong login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: &id006
                missing: *id004
                expired: *id005
      security:
      - HTTPBearer: []
  /api/v1/vehicles:
    get:
      tags:
      - vehicles
      summary: List my vehicles
      description: The signed-in user's vehicles.
      operationId: list_vehicles
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VehicleOut'
                type: array
                title: Response List Vehicles
              examples:
                default:
                  summary: Two vehicles
                  value:
                  - &id007
                    id: 7f59951e-fa3a-48e6-97f8-bcaeaadf44b9
                    name: Family car
                    fuel_type: petrol95
                    consumption_l100: '7.5'
                    tank_l: '50.0'
                    is_default: true
                    created_at: '2026-11-23T14:51:02.755411+02:00'
                    updated_at: '2026-11-23T14:51:02.755411+02:00'
                  - id: 335b9b1c-9a9d-449b-bb2a-0f4e4974e1f9
                    name: Diesel van
                    fuel_type: diesel
                    consumption_l100: '8.2'
                    tank_l: null
                    is_default: false
                    created_at: '2026-11-23T14:51:02.782024+02:00'
                    updated_at: '2026-11-23T14:51:02.803658+02:00'
        '401':
          description: Missing, malformed or expired access token, or wrong login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: *id006
      security:
      - HTTPBearer: []
    post:
      tags:
      - vehicles
      summary: Add a vehicle (US-03)
      description: |
        Adds a vehicle. If `is_default` is true, the previous default vehicle stops being the default. The first
        vehicle becomes the default automatically.
      operationId: create_vehicle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreate'
            examples:
              petrol:
                summary: Petrol car with a known tank
                value:
                  name: Family car
                  fuel_type: petrol95
                  consumption_l100: 7.5
                  tank_l: 50
                  is_default: true
              diesel:
                summary: Diesel van without a tank size
                value:
                  name: Diesel van
                  fuel_type: diesel
                  consumption_l100: 8.2
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleOut'
              examples:
                default:
                  summary: Vehicle created
                  value: *id007
        '401':
          description: Missing, malformed or expired access token, or wrong login credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: *id006
        '422':
          description: Invalid input (`details` lists the fields) or no route between the points
          content:
            application/json:
              schema: *id002
              examples:
                default:
                  summary: Invalid vehicle
                  value:
                    error:
                      code: validation_failed
                      message: request validation failed
                      details:
                      - field: name
                        message: String should have at least 1 character
                      - field: fuel_type
                        message: Input should be 'petrol95' or 'diesel'
                      - field: consumption_l100
                        message: Input should be greater than or equal to 2.0
                      request_id: fb956027107b4a219803813b9a854540
      security:
      - HTTPBearer: []
  /api/v1/vehicles/{vehicle_id}:
    get:
      tags:
      - vehicles
      summary: Get a vehicle
      description: Returns one vehicle. A vehicle of another user answers 404.
      operationId: get_vehicle
      security:
      - HTTPBearer: []
      parameters:
      - name: vehicle_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Vehicle Id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleOut'
              examples:
                default:
                  summary: One vehicle
                  value: *id007
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: *id006
          description: Missing, malformed or expired access token, or wrong login credentials
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  summary: Unknown vehicle or one of another user
                  value:
                    error:
                      code: not_found
                      message: vehicle not found
                      details: null
                      request_id: fb956027107b4a219803813b9a854540
          description: The resource does not exist or belongs to another user
        '422':
          description: Invalid input (`details` lists the fields) or no route between the points
          content:
            application/json:
              schema: *id002
              example:
                error:
                  code: validation_failed
                  message: request validation failed
                  details: null
                  request_id: fb956027107b4a219803813b9a854540
    patch:
      tags:
      - vehicles
      summary: Edit a vehicle
      description: 'Partial update: send only the fields that change.'
      operationId: update_vehicle
      security:
      - HTTPBearer: []
      parameters:
      - name: vehicle_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Vehicle Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleUpdate'
            examples:
              default:
                summary: Change the consumption and make it the default
                value:
                  consumption_l100: 8.0
                  is_default: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleOut'
              examples:
                default:
                  summary: Updated vehicle
                  value:
                    id: 335b9b1c-9a9d-449b-bb2a-0f4e4974e1f9
                    name: Diesel van
                    fuel_type: diesel
                    consumption_l100: '8.0'
                    tank_l: null
                    is_default: true
                    created_at: '2026-11-23T14:51:02.782024+02:00'
                    updated_at: '2026-11-23T14:51:02.803658+02:00'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: *id006
          description: Missing, malformed or expired access token, or wrong login credentials
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  summary: Unknown vehicle or one of another user
                  value:
                    error:
                      code: not_found
                      message: vehicle not found
                      details: null
                      request_id: fb956027107b4a219803813b9a854540
          description: The resource does not exist or belongs to another user
        '422':
          description: Invalid input (`details` lists the fields) or no route between the points
          content:
            application/json:
              schema: *id002
              example:
                error:
                  code: validation_failed
                  message: request validation failed
                  details: null
                  request_id: fb956027107b4a219803813b9a854540
    delete:
      tags:
      - vehicles
      summary: Delete a vehicle (its trips stay in the history, US-04)
      description: Deletes a vehicle. Saved trips stay in the history with their own copy of the vehicle data (US-04).
      operationId: delete_vehicle
      security:
      - HTTPBearer: []
      parameters:
      - name: vehicle_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Vehicle Id
      responses:
        '204':
          description: Success, no content
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: *id006
          description: Missing, malformed or expired access token, or wrong login credentials
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  summary: Unknown vehicle or one of another user
                  value:
                    error:
                      code: not_found
                      message: vehicle not found
                      details: null
                      request_id: fb956027107b4a219803813b9a854540
          description: The resource does not exist or belongs to another user
        '422':
          description: Invalid input (`details` lists the fields) or no route between the points
          content:
            application/json:
              schema: *id002
              example:
                error:
                  code: validation_failed
                  message: request validation failed
                  details: null
                  request_id: fb956027107b4a219803813b9a854540
  /api/v1/trips:
    post:
      tags:
      - trips
      summary: Calculate the cost of a trip and save it to the history (US-05 ... US-16)
      description: |
        Asks the routing engine for the route, splits it by country, prices fuel, road charges and lodging,
        plans the days and an optional refuel stop, and saves the result to the history in one transaction.

        The coordinates are used for routing only and are never stored. The response is the saved trip with its
        cost lines. Errors: 422 for invalid input, when no route exists, or when there is no vehicle (none added,
        or `vehicle_id` is unknown or belongs to someone else), 502 when the routing engine is not available.
      operationId: create_trip
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
            examples:
              typical:
                summary: One day, refuel advice
                value:
                  origin_label: Vilnius
                  destination_label: Warsaw
                  origin:
                    lon: 25.28
                    lat: 54.69
                  destination:
                    lon: 21.01
                    lat: 52.23
                  variant: fastest
                  daily_limit_h: 8
                  lodging_class: standard
                  start_fuel: half
              two_days:
                summary: Two days, own price for the night, no toll roads
                value:
                  origin_label: Warsaw
                  destination_label: Berlin
                  origin:
                    lon: 21.01
                    lat: 52.23
                  destination:
                    lon: 13.4
                    lat: 52.52
                  variant: no_tolls
                  daily_limit_h: 4
                  lodging_class: comfort
                  lodging_entered_eur: 70
                  title: Warsaw to Berlin in two days
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripOut'
              examples:
                typical:
                  summary: Vilnius - Warsaw in one day with a refuel stop
                  value: &id009
                    id: 6a1d0a76-0929-4e21-8aab-57a495838da8
                    title: Vilnius - Warsaw
                    origin_label: Vilnius
                    destination_label: Warsaw
                    departed_at: '2026-11-23T14:36:57.556210+02:00'
                    arrival_at: '2026-11-23T20:12:13.627639+02:00'
                    destination_country: PL
                    variant: fastest
                    distance_km: '460.0'
                    duration_min: 335
                    daily_limit_h: '8.0'
                    nights: 0
                    vehicle_id: 0389ba65-4fb7-453b-bf24-696b087c62d7
                    vehicle_name: Family car
                    fuel_type: petrol95
                    consumption_l100: '7.5'
                    start_fuel: half
                    refuel_saving_eur: '0.00'
                    price_date: '2026-11-09'
                    total_eur: '50.46'
                    created_at: '2026-11-23T14:36:57.485214+02:00'
                    lines:
                    - &id010
                      kind: fuel
                      country: LT
                      distance_km: '187.5'
                      unit_price: '1.554'
                      amount_eur: '21.85'
                      status: ok
                    - &id011
                      kind: fuel
                      country: PL
                      distance_km: '272.5'
                      unit_price: '1.400'
                      amount_eur: '28.61'
                      status: ok
                    refuel_stops:
                    - &id012
                      seq: 1
                      country: PL
                      km_from_start: '187.5'
                      liters: '14.5'
                      price_eur_l: '1.400'
                two_days:
                  summary: Warsaw - Berlin with one night and the user's own price
                  value: &id008
                    id: fb05908d-3144-4e7b-93f3-3bb4b1d28814
                    title: Warsaw to Berlin in two days
                    origin_label: Warsaw
                    destination_label: Berlin
                    departed_at: '2026-11-23T14:51:02.860132+02:00'
                    arrival_at: '2026-11-24T16:15:09.568207+02:00'
                    destination_country: DE
                    variant: no_tolls
                    distance_km: '460.0'
                    duration_min: 324
                    daily_limit_h: '4.0'
                    nights: 1
                    vehicle_id: 335b9b1c-9a9d-449b-bb2a-0f4e4974e1f9
                    vehicle_name: Diesel van
                    fuel_type: diesel
                    consumption_l100: '8.0'
                    start_fuel: null
                    refuel_saving_eur: null
                    price_date: '2026-11-09'
                    total_eur: '121.84'
                    created_at: '2026-11-23T14:51:02.823060+02:00'
                    lines:
                    - kind: fuel
                      country: PL
                      distance_km: '388.2'
                      unit_price: '1.360'
                      amount_eur: '42.24'
                      status: ok
                    - kind: fuel
                      country: DE
                      distance_km: '71.8'
                      unit_price: '1.672'
                      amount_eur: '9.60'
                      status: ok
                    - kind: lodging
                      country: DE
                      distance_km: null
                      unit_price: null
                      amount_eur: '70.00'
                      status: user_entered
                    refuel_stops: []
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: *id006
          description: Missing, malformed or expired access token, or wrong login credentials
        '422':
          content:
            application/json:
              schema: *id002
              examples:
                invalid:
                  summary: Invalid coordinates and daily limit
                  value:
                    error:
                      code: validation_failed
                      message: request validation failed
                      details:
                      - field: origin.lon
                        message: Input should be less than or equal to 180
                      - field: daily_limit_h
                        message: Input should be greater than or equal to 4.0
                      request_id: fb956027107b4a219803813b9a854540
                no_vehicle:
                  summary: No vehicle added and none named
                  value:
                    error:
                      code: validation_failed
                      message: 'no vehicle: add a vehicle or pass an existing vehicle_id'
                      details: null
                      request_id: fb956027107b4a219803813b9a854540
          description: Invalid input (`details` lists the fields) or no route between the points
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  summary: Routing engine not reachable; nothing is saved
                  value:
                    error:
                      code: upstream_unavailable
                      message: routing engine is not available
                      details: null
                      request_id: fb956027107b4a219803813b9a854540
          description: The routing engine is not reachable
    get:
      tags:
      - trips
      summary: Trip history, newest first (US-17)
      description: Returns the signed-in user's saved trips, newest first, in pages (`limit` 1-100, default 20;
        `offset` from 0).
      operationId: list_trips
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
              examples:
                default:
                  summary: History page
                  value:
                    items:
                    - *id008
                    - *id009
                    total: 2
                    limit: 20
                    offset: 0
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples: *id006
          description: Missing, malformed or expired access token, or wrong login credentials
        '422':
          description: Invalid input (`details` lists the fields) or no route between the points
          content:
            application/json:
              schema: *id002
              examples:
                default:
                  summary: Page size too large
                  value:
                    error:
                      code: validation_failed
                      message: request validation failed
                      details:
                      - field: limit
                        message: Input should be less than or equal to 100
                      request_id: fb956027107b4a219803813b9a854540
