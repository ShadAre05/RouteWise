components:
  schemas:
    ChangePasswordRequest:
      properties:
        old_password:
          type: string
          maxLength: 128
          minLength: 1
          title: Old Password
          examples:
          - correct-horse-battery
        new_password:
          type: string
          maxLength: 128
          minLength: 8
          title: New Password
          examples:
          - even-better-passphrase
      type: object
      required:
      - old_password
      - new_password
      title: ChangePasswordRequest
    CostLineOut:
      properties:
        kind:
          type: string
          enum:
          - fuel
          - road
          - lodging
          title: Kind
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
          description: ISO 3166-1 alpha-2 code
          examples:
          - PL
        distance_km:
          anyOf:
          - type: string
          - type: 'null'
          title: Distance Km
          description: Kilometres driven in this country (fuel lines)
          examples:
          - '272.5'
        unit_price:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit Price
          description: EUR per litre, per kilometre or per night
          examples:
          - '1.400'
        amount_eur:
          anyOf:
          - type: string
          - type: 'null'
          title: Amount Eur
          examples:
          - '28.61'
        status:
          type: string
          enum:
          - ok
          - no_data
          - estimate
          - eu_average
          - user_entered
          title: Status
          description: 'ok: from the data; eu_average: no price for the country, average of the others used; estimate:
            typical value; user_entered: given by the caller; no_data: amount unknown'
      type: object
      required:
      - kind
      - country
      - distance_km
      - unit_price
      - amount_eur
      - status
      title: CostLineOut
      description: One line of the cost breakdown. The total of a trip is the sum of its lines.
    CountryOut:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        timezone:
          type: string
          title: Timezone
      type: object
      required:
      - code
      - name
      - timezone
      title: CountryOut
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
          description: 'Stable machine-readable code: validation_failed, unauthorized, forbidden, not_found, conflict,
            no_route, upstream_unavailable, internal_error'
          examples:
          - not_found
        message:
          type: string
          title: Message
          description: Human-readable explanation; may change, do not parse it
          examples:
          - trip not found
        details:
          anyOf:
          - {}
          - type: 'null'
          title: Details
          description: 'For validation_failed: a list of {field, message}; otherwise null'
        request_id:
          type: string
          title: Request Id
          description: Correlation id, also returned in the X-Request-ID header; quote it when reporting a problem
          examples:
          - fb956027107b4a219803813b9a854540
      type: object
      required:
      - code
      - message
      - request_id
      title: ErrorBody
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorResponse
      description: The single error format of the whole API.
    FuelPriceOut:
      properties:
        country:
          type: string
          title: Country
        price_eur_l:
          type: string
          title: Price Eur L
        bulletin_date:
          type: string
          format: date
          title: Bulletin Date
      type: object
      required:
      - country
      - price_eur_l
      - bulletin_date
      title: FuelPriceOut
    LodgingRateOut:
      properties:
        country:
          type: string
          title: Country
        class:
          type: string
          enum:
          - economy
          - standard
          - comfort
          title: Class
        nightly_eur:
          type: string
          title: Nightly Eur
        checked_on:
          type: string
          format: date
          title: Checked On
      type: object
      required:
      - country
      - class
      - nightly_eur
      - checked_on
      title: LodgingRateOut
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          examples:
          - driver@example.com
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
          examples:
          - correct-horse-battery
      type: object
      required:
      - email
      - password
      title: LoginRequest
    Point:
      properties:
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          examples:
          - 25.28
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          examples:
          - 54.69
      type: object
      required:
      - lon
      - lat
      title: Point
      description: A WGS84 coordinate. Longitude comes first (GeoJSON order).
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          maxLength: 200
          minLength: 20
          title: Refresh Token
          description: The refresh token received at login; it can be used once
          examples:
          - 5ceIFcTIm95XFCvLwSZy4tZPOONIK4T3f7nYpJD9OxVp3VxwBd662d1j4zchTofv
      type: object
      required:
      - refresh_token
      title: RefreshRequest
    RefuelStopOut:
      properties:
        seq:
          type: integer
          title: Seq
          description: Order of the stop, starting at 1
          examples:
          - 1
        country:
          type: string
          title: Country
          examples:
          - PL
        km_from_start:
          type: string
          title: Km From Start
          examples:
          - '187.5'
        liters:
          type: string
          title: Liters
          examples:
          - '14.5'
        price_eur_l:
          type: string
          title: Price Eur L
          examples:
          - '1.400'
      type: object
      required:
      - seq
      - country
      - km_from_start
      - liters
      - price_eur_l
      title: RefuelStopOut
      description: A suggested refuelling stop. Advice only; it is not part of the total.
    RegisterRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: Account e-mail; stored in lower case, must be unique
          examples:
          - driver@example.com
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
          description: 8-128 characters
          examples:
          - correct-horse-battery
        privacy_accepted:
          type: boolean
          const: true
          title: Privacy Accepted
          description: 'Must be true: the privacy notice has to be accepted (US-01)'
      type: object
      required:
      - email
      - password
      - privacy_accepted
      title: RegisterRequest
    SpeedProfileOut:
      properties:
        country:
          type: string
          title: Country
        season:
          type: string
          enum:
          - summer
          - winter
          title: Season
        avg_speed_kmh:
          type: string
          title: Avg Speed Kmh
        motorway_limit_kmh:
          anyOf:
          - type: integer
          - type: 'null'
          title: Motorway Limit Kmh
        limit_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Limit Note
      type: object
      required:
      - country
      - season
      - avg_speed_kmh
      - motorway_limit_kmh
      - limit_note
      title: SpeedProfileOut
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
          description: 'JWT; send as ''Authorization: Bearer <token>'''
          examples:
          - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          title: Refresh Token
          description: Opaque single-use token for POST /auth/refresh
        token_type:
          type: string
          const: bearer
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
          description: Access token lifetime in seconds
          examples:
          - 900
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in
      title: TokenResponse
      examples:
      - access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOi...
        expires_in: 900
        refresh_token: 5ceIFcTIm95XFCvLwSZy4tZPOONIK4T3f7nYpJD9OxVp3VxwBd662d1j4zchTofv
        token_type: bearer
    TrendPoint:
      properties:
        bulletin_date:
          type: string
          format: date
          title: Bulletin Date
        price_eur_l:
          type: string
          title: Price Eur L
      type: object
      required:
      - bulletin_date
      - price_eur_l
      title: TrendPoint
    TripCreate:
      properties:
        origin_label:
          type: string
          maxLength: 120
          minLength: 1
          title: Origin Label
          description: Text shown for the start; only the label is stored, not the coordinates
          examples:
          - Vilnius
        destination_label:
          type: string
          maxLength: 120
          minLength: 1
          title: Destination Label
          examples:
          - Warsaw
        origin:
          $ref: '#/components/schemas/Point'
          description: Start point; used for routing only and never stored
        destination:
          $ref: '#/components/schemas/Point'
          description: End point; used for routing only and never stored
        variant:
          type: string
          enum:
          - fastest
          - shortest
          - no_tolls
          title: Variant
          description: fastest, shortest (shortest of the alternatives) or no_tolls (toll roads avoided)
          default: fastest
        vehicle_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Vehicle Id
          description: Omit to use the default vehicle
        daily_limit_h:
          anyOf:
          - type: number
            maximum: 10.0
            minimum: 4.0
          - type: string
          - type: 'null'
          title: Daily Limit H
          description: Maximum driving hours per day (4.0-10.0); splits the trip into days and nights
          examples:
          - 8
        lodging_class:
          type: string
          enum:
