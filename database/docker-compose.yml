# Local PostgreSQL 16 + PostGIS for development and for the defense demo.
# Credentials come from .env (not committed).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${PG_SUPERUSER}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - .pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER}"]
      interval: 5s
      retries: 10
