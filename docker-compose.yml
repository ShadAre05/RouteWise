# Whole back-end stack: PostgreSQL+PostGIS, one-shot database setup, API (and optionally OSRM).
#   cp .env.example .env   # set your own values
#   docker compose up -d --build
# API: http://localhost:8000/docs
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${PG_SUPERUSER}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP check (-h): during the first start PostgreSQL runs a temporary server that answers only on the socket,
      # so a socket check reports "healthy" before the real server accepts connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${PG_SUPERUSER}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  db-init:           # roles, extensions, migrations and reference data (idempotent: safe on every start)
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database:/work:ro
    working_dir: /work
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE}
      PG_SUPERUSER: ${PG_SUPERUSER}
      PG_SUPERUSER_PASSWORD: ${PG_SUPERUSER_PASSWORD}
      RW_OWNER_PASSWORD: ${RW_OWNER_PASSWORD}
      RW_APP_PASSWORD: ${RW_APP_PASSWORD}
      RW_REPORTING_PASSWORD: ${RW_REPORTING_PASSWORD}
      RW_ADMIN_PASSWORD: ${RW_ADMIN_PASSWORD}
      SEED_FLAG: ${SEED_FLAG:-}   # set SEED_FLAG=--test-data in .env for a demo (synthetic users, prices, trips)
    command: ["bash", "-c", "bash scripts/bootstrap.sh && bash scripts/migrate.sh && bash scripts/seed.sh $${SEED_FLAG:-}"]
    restart: "no"

  api:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://rw_app:${RW_APP_PASSWORD}@db:5432/${PGDATABASE}
      JWT_SECRET: ${JWT_SECRET}
      OSRM_BASE_URL: ${OSRM_BASE_URL}
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  fuel-import:       # optional, on demand: weekly import of the EC Weekly Oil Bulletin (see backend/README.md)
    build: ./backend
    profiles: ["import"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ADMIN_DATABASE_URL: postgresql://rw_admin_user:${RW_ADMIN_PASSWORD}@db:5432/${PGDATABASE}
      FUEL_BULLETIN_URL: ${FUEL_BULLETIN_URL:-}
    volumes:
      - ./imports:/imports:ro
    command: ["python", "-m", "app.importers.run"]
    restart: "no"

  osrm:              # optional: docker compose --profile routing up -d   (needs prepared map data, see backend/README.md)
    image: ghcr.io/project-osrm/osrm-backend:latest
    profiles: ["routing"]
    command: osrm-routed --algorithm mld /data/region.osrm
    volumes:
      - ./osrm-data:/data:ro
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  pgdata:
