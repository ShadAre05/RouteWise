name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: ci_superuser_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: routewise
      PG_SUPERUSER: postgres
      PG_SUPERUSER_PASSWORD: ci_superuser_password
      RW_OWNER_PASSWORD: ci_owner_password
      RW_APP_PASSWORD: ci_app_password
      RW_REPORTING_PASSWORD: ci_reporting_password
      RW_ADMIN_PASSWORD: ci_admin_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Database - build from migrations, load seeds and test data, run database tests
        run: database/scripts/setup_all.sh
      - name: Lint
        run: ruff check backend
        working-directory: .
      - name: Dependency vulnerability scan
        run: pip-audit -r backend/requirements.txt
      - name: Back-end tests with coverage gate (unit + integration against the real database)
        working-directory: backend
        env:
          INTEGRATION_DATABASE_URL: postgresql+psycopg://rw_app:ci_app_password@localhost:5432/routewise
        run: pytest --cov=app --cov-fail-under=80

  image:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image (only after every check passed)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/routewise-api:latest
            ghcr.io/${{ github.repository_owner }}/routewise-api:${{ github.sha }}
