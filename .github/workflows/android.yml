name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # Robolectric downloads an Android image from Maven Central on first use; Maven Central sometimes answers
      # 429 (rate limit). The image is cached between runs, and the test step is tried twice.
      - name: Cache the Robolectric Android image
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-14-${{ hashFiles('android/app/build.gradle.kts') }}

      - name: Unit and UI tests
        run: ./gradlew testDebugUnitTest --stacktrace || (sleep 20 && ./gradlew testDebugUnitTest --stacktrace)

      - name: Build the debug APK (demo mode, no server needed)
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint (report only)
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: routewise-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest
